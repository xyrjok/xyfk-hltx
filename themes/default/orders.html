<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单查询</title>
    
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/all.min.css" rel="stylesheet">
    <link href="/files/custom-default-bootstrap.css" rel="stylesheet">
    
    <style>
        /* 选项卡样式微调 */
        .nav-tabs .nav-link {
            color: #6c757d;
            border: none;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            padding: 12px 20px;
        }
        .nav-tabs .nav-link:hover {
            color: var(--luna-primary-blue);
        }
        .nav-tabs .nav-link.active {
            color: var(--luna-primary-blue);
            background: transparent;
            border-bottom: 2px solid var(--luna-primary-blue);
            font-weight: bold;
        }
        
        /* 结果卡片样式 */
        .order-card {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.2s;
            background: #fff;
        }
        .order-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-color: #d3d4d5;
        }
        
        .order-header {
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-bottom: 1px solid #e9ecef;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-body {
            padding: 15px;
        }
        
        /* 卡密内容显示框 */
        .card-content-box {
            background-color: #dbedff;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #333;
            margin-top: 10px;
            word-break: break-all;
            position: relative;
            border: 1px dashed #dee2e6;
        }
        
        .btn-copy {
            font-size: 12px;
            padding: 2px 8px;
            margin-top: 5px;
            cursor: pointer;
            border: 1px solid #dee2e6;
            background: #fff;
            border-radius: 4px;
            color: #666;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-copy:hover {
            border-color: var(--luna-primary-blue);
            color: var(--luna-primary-blue);
        }

        /* 缓存提示条 */
        .cache-hint {
            background-color: #e7f1ff;
            color: #0c63e4;
            border: 1px solid #b6d4fe;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 13px;
            margin-bottom: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cache-hint:hover {
            background-color: #cfe2ff;
        }
        .tab-pane:not(.show) { display: none; }

        /* 验证码样式 */
        .captcha-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .captcha-row input {
            flex: 1;
        }
        .captcha-img {
            cursor: pointer;
            height: 38px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            background: #f4f6f8;
            border: 1px solid #ddd;
        }
        .captcha-img:hover {
            border-color: #409EFF;
        }

        /* 查单密码可见性切换（眼睛图标） */
        .pwd-wrap { position: relative; }
        .pwd-wrap .form-control { padding-right: 34px; }
        .toggle-pwd {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #adb5bd; z-index: 5; font-size: 14px;
        }
        .toggle-pwd:hover { color: var(--luna-primary-blue, #0d6efd); }
    </style>
</head>
<body>

    <div class="container my-4" style="min-height: 60vh;">
        <div class="product-detail-grid">
            
            <div class="detail-left main-box p-4">
                <div id="result-area" style="min-height: 400px;">
                    <h5 class="fw-bold border-bottom pb-2 mb-3">
                        <i class="far fa-list-ul me-2" style="color: var(--luna-primary-blue);"></i>查询结果
                    </h5>
                    <div id="result-content">
                        <div class="text-center py-5 text-muted">
                            <i class="fas fa-search fa-2x mb-3" style="opacity: 0.2;"></i>
                            <p>请在右侧输入信息并点击查询</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="detail-right" id="sidebar-wrapper">
                <div class="sidebar-inner main-box p-3">
                    <h6 class="fw-bold border-bottom pb-3 mb-3">订单查询</h6>
                    <div class="alert alert-warning small py-2 d-flex align-items-start mb-3" role="alert">
                        <i class="fas fa-info-circle me-2 mt-1"></i>
                        <div>提示：本站仅支持查询最近 30 天内下单的订单</div>
                    </div>
                    
                    <ul class="nav nav-tabs mb-4 justify-content-center" id="queryTabs" role="tablist" style="font-size: 14px;">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="contact-tab" data-bs-toggle="tab" data-bs-target="#by-contact" type="button">联系方式</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="order-tab" data-bs-toggle="tab" data-bs-target="#by-order" type="button">订单号</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="by-contact">
                            <div id="local-cache-box" class="cache-hint d-none mb-3" onclick="queryByContact(true)">
                                <div><i class="fas fa-history me-1"></i> 记录: <strong id="cache-contact-text"></strong></div>
                                <i class="fas fa-chevron-right small"></i>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted">联系方式</label>
                                <input type="text" class="form-control form-control-sm" id="input-contact" placeholder="QQ/手机/邮箱">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small text-muted">查单密码 <span class="text-danger">*</span></label>
                                <div class="pwd-wrap">
                                    <input type="password" class="form-control form-control-sm pe-5" id="input-password" placeholder="至少4位密码">
                                    <i class="far fa-eye toggle-pwd" id="toggle-password" onclick="togglePassword()" title="显示/隐藏密码" aria-label="显示/隐藏密码"></i>
                                </div>
                            </div>
                            <!-- [安全加固] 验证码 -->
                            <div class="mb-4">
                                <label class="form-label small text-muted">验证码 <span class="text-danger">*</span></label>
                                <div class="captcha-row">
                                    <input type="text" class="form-control form-control-sm" id="input-captcha" placeholder="输入验证码" autocomplete="off" maxlength="4">
                                    <div class="captcha-img" id="captcha-img" onclick="loadCaptcha()" title="看不清？点击刷新"></div>
                                </div>
                            </div>
                            <button class="btn btn-primary w-100 py-2 fw-bold" onclick="queryByContact(false)" style="background-color: var(--luna-primary-blue);">立即查询</button>
                        </div>

                        <div class="tab-pane fade" id="by-order">
                            <div class="mb-4 mt-2">
                                <label class="form-label small text-muted">商户订单号</label>
                                <input type="text" class="form-control form-control-sm" id="input-order-id" placeholder="2023xxxxx">
                            </div>
                            <button class="btn btn-primary w-100 py-2 fw-bold" onclick="queryByOrderId()" style="background-color: var(--luna-primary-blue);">立即查询</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/assets/jquery-3.6.0.min.js"></script>
    <script src="/assets/bootstrap.bundle.min.js"></script>  
    <script src="/files/header.js"></script>
    <script src="/files/footer.js"></script>
    <script src="/files/main-default-bs.js"></script>
    <script>
        // [安全加固] 验证码相关变量
        let currentCaptchaHash = '';
        let currentCaptchaExpire = 0;

        // 页面初始化
        $(document).ready(function() {
            checkLocalCache();
            loadCaptcha(); // 加载验证码
            
            const c = localStorage.getItem('userContact');
            const p = localStorage.getItem('userPassword');
            if(c && p && document.referrer.includes('product')) {
                 queryByContact(true);
            }            
        });

        // [安全加固] 加载验证码
        async function loadCaptcha() {
            try {
                const res = await fetch('/api/admin/captcha');
                const data = await res.json();
                document.getElementById('captcha-img').innerHTML = data.svg;
                currentCaptchaHash = data.hash;
                currentCaptchaExpire = data.expire;
            } catch (e) {
                console.error('验证码加载失败');
            }
        }

        function checkLocalCache() {
            const c = localStorage.getItem('userContact');
            const p = localStorage.getItem('userPassword');
            
            if (c && p) {
                $('#input-contact').val(c);
                $('#input-password').val(p);
                $('#cache-contact-text').text(c);
                $('#local-cache-box').removeClass('d-none');
            }
        }

        // 查单密码明文/掩码切换
        function togglePassword() {
            const input = document.getElementById('input-password');
            const icon = document.getElementById('toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showResult(html) {
            $('#result-content').html(html);
            $('html, body').animate({
                scrollTop: $("#result-area").offset().top - 20
            }, 500);
        }

        function showError(msg) {
            showResult(`<div class="alert alert-danger text-center m-3"><i class="fas fa-exclamation-circle me-2"></i> ${msg}</div>`);
        }

        // --- 联系方式查询 ---
        async function queryByContact(useCache = false) {
            let contact, pass;

            if (useCache) {
                contact = localStorage.getItem('userContact');
                pass = localStorage.getItem('userPassword');
                if(contact) $('#input-contact').val(contact);
                if(pass) $('#input-password').val(pass);
            } else {
                contact = $('#input-contact').val().trim();
                pass = $('#input-password').val().trim();
            }
            
            if (!contact || !pass) { alert('请输入联系方式和查单密码'); return; }
            if (pass.length < 3) { alert('查单密码不能少于3位'); return; }

            // [安全加固] 获取验证码
            const captchaText = $('#input-captcha').val().trim();
            if (!captchaText) { alert('请输入验证码'); return; }

            // 更新缓存
            localStorage.setItem('userContact', contact);
            localStorage.setItem('userPassword', pass);
            checkLocalCache();

            const btn = $('button[onclick="queryByContact(false)"]');
            const originalText = btn.html();
            btn.html('<i class="fas fa-spinner fa-spin"></i> 查询中...').prop('disabled', true);

            $('#result-content').html('<div class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-2">正在加载数据...</p></div>');

            try {
                const res = await fetch('/api/shop/orders/query', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        contact, 
                        query_password: pass,
                        captchaText: captchaText,
                        captchaHash: currentCaptchaHash,
                        captchaExpire: currentCaptchaExpire
                    })
                });
                const data = await res.json();

                if (data.error) throw new Error(data.error);
                if (data.length === 0) {
                    showError('未找到相关订单');
                } else {
                    renderFullOrderList(data);
                }

            } catch(e) {
                showError(e.message || '查询失败');
            } finally {
                btn.html(originalText).prop('disabled', false);
                loadCaptcha(); // 查询后刷新验证码
            }
        }

        // --- 渲染订单列表 ---
        function renderFullOrderList(orders) {
            let html = '';
            orders.forEach(order => {
                let statusBadge, contentBody, actionBtns = '';

                if (order.status === 0) {
                    statusBadge = '<span class="badge bg-danger">未支付</span>';
                    contentBody = '<div class="text-muted small py-2"><i class="fas fa-clock me-1"></i> 订单未支付，支付后自动显示卡密</div>';
                    actionBtns = `
                        <div class="mt-2 pt-2 border-top text-end">
                            <button id="btn-del-${order.id}" class="btn btn-sm btn-outline-secondary me-2" onclick="deleteOrder('${order.id}')">删除</button>
                            <a href="/pay?order_id=${order.id}&method=${order.payment_method || ''}" class="btn btn-sm btn-danger fw-bold">
                                去支付 <i class="fas fa-angle-right"></i>
                            </a>
                        </div>
                    `;
                } else if (order.status === 1) {
                    statusBadge = '<span class="badge bg-warning text-dark">待人工处理</span>';
                    let cards = [];
                    try { cards = JSON.parse(order.cards_sent || '[]'); } catch(e) {}
                    
                    if (cards.length > 0) {
                        contentBody = renderCardsHtml(cards) + '<div class="alert alert-warning small mt-2 mb-0 py-2 fw-bold text-danger text-center"><i class="fas fa-exclamation-triangle"></i> 订单中包含手动发货商品，请联系客服发货。</div>';
                    } else {
                        contentBody = '<div class="alert alert-warning small mb-0 py-3 fw-bold text-danger text-center">该商品规格为手动发货，请联系商家发手动发货。</div>';
                    }
                } else {
                    statusBadge = '<span class="badge bg-success">交易成功</span>';
                    let cards = [];
                    try { cards = JSON.parse(order.cards_sent || '[]'); } catch(e) {}
                    
                    if (cards.length > 0) {
                        contentBody = renderCardsHtml(cards);
                    } else {
                        contentBody = '<div class="text-muted small py-2">无卡密内容</div>';
                    }
                }

                html += `
                    <div class="order-card" id="order-card-${order.id}">
                        <div class="order-header">
                            <span><i class="far fa-calendar-alt me-1"></i> ${order.created_at_str || '时间未知'}</span>
                            ${statusBadge}
                        </div>
                        <div class="order-body">
                            <h6 class="mb-2 text-dark fw-bold">
                                ${escapeHtml(order.product_name)} 
                                <span class="badge bg-light text-dark border ms-1 fw-normal" style="font-size: 12px;">${order.variant_name}</span>
                            </h6>
                            <p class="mb-2 text-muted small">
                                订单号: ${order.id} <span class="mx-2">|</span> 
                                金额: <span class="text-danger fw-bold">¥${order.total_amount}</span>
                            </p>
                            ${contentBody}
                            ${actionBtns}
                        </div>
                    </div>
                `;
            });
            showResult(html);
        }

        // --- 订单号查询 ---
        function queryByOrderId() {
            const orderId = $('#input-order-id').val().trim();
            if (!orderId) { alert('请输入订单号'); return; }

            const btn = $(event.target);
            const originalText = btn.html();
            btn.html('<i class="fas fa-spinner fa-spin"></i>').prop('disabled', true);

            $('#result-content').html('<div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x"></i></div>');

            // [订单查询限制] 前台仅支持查询最近 30 天内的订单，window_days 由服务端校验
            fetch(`/api/shop/order/status?order_id=${orderId}&window_days=30`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    if (data.status >= 1) {
                        renderSuccessSingle(orderId, data.cards, data.status);
                    } else {
                        showError('订单未支付、不存在或未发货。<br>如需管理未支付订单，请使用"联系方式查询"。');
                    }
                })
                .catch(err => showError(err.message || '查询出错'))
                .finally(() => {
                    btn.html(originalText).prop('disabled', false);
                });
        }

        function renderSuccessSingle(orderId, cards, status) {
            let html = `
                <div class="alert alert-success text-center py-2 mb-3">
                    <i class="fas fa-check-circle me-1"></i> 您的订单已发货
                </div>
                <div class="order-card">
                    <div class="order-header">
                        <span>订单号：${orderId}</span>
                        <span class="badge bg-success">已完成</span>
                    </div>
                    <div class="order-body">
                        ${renderCardsHtml(cards)}
                        ${status === 1 ? (cards && cards.length > 0 ? '<div class="alert alert-warning small mt-3 mb-0 py-2 fw-bold text-danger text-center">注意：包含手动发货商品，请联系客服发货。</div>' : '<div class="alert alert-warning small mt-3 mb-0 py-2 fw-bold text-danger text-center">该商品为手动发货，请联系商家发货。</div>') : ''}
                    </div>
                </div>
            `;
            showResult(html);
        }

        // --- 辅助函数 ---
        
        async function deleteOrder(orderId) {
            if(!confirm('确定要删除这个未支付的订单吗？')) return;
            
            const contact = localStorage.getItem('userContact') || $('#input-contact').val();
            const password = localStorage.getItem('userPassword') || $('#input-password').val();

            const btn = $(`#btn-del-${orderId}`);
            btn.prop('disabled', true).text('删除中...');

            try {
                const res = await fetch('/api/shop/order/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: orderId, contact, query_password: password })
                });
                const data = await res.json();
                
                if(data.success) {
                    $(`#order-card-${orderId}`).fadeOut(300, function(){ $(this).remove(); });
                } else {
                    alert(data.error || '删除失败');
                    btn.prop('disabled', false).text('删除');
                }
            } catch(e) {
                alert('网络错误');
                btn.prop('disabled', false).text('删除');
            }
        }

        function renderCardsHtml(cards) {
            if (!cards || cards.length === 0) return '<div class="text-muted small">无发货内容</div>';
            
            // [复制按钮] 与收银台 pay.html 保持一致：逐条复制 + 复制全部，XYFK 未加载时降级为不渲染按钮
            const XY = window.XYFK || null;
            const mkBtn = (raw, label, title, okMsg, cls) => XY
                ? '<button type="button" class="' + cls + '" data-xy-copy="' + XY.enc(raw) + '" data-xy-msg="' + XY.esc(okMsg) + '" title="' + title + '" aria-label="' + title + '">' + label + '</button>'
                : '';

            // 形态① 占位/摘要（购物车未发货占位、自选卡密占位）：没有真实卡密内容，保持原展示，只给一个复制按钮
            if (typeof cards[0] === 'object' && cards[0] !== null && !Array.isArray(cards[0].cards)) {
                const contentStr = cards.map(item => `[${item.variantName || item.productName || '指定商品'} x${item.quantity || 1}]`).join('\n') + '\n(请查看具体发货详情)';
                return `
                <div class="card-content-box">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="small text-muted">发货摘要</span>
                        ${mkBtn(contentStr, '复制', '复制发货摘要', '已复制发货摘要', 'btn-copy')}
                    </div>
                    <div style="white-space: pre-wrap;">${escapeHtml(contentStr)}</div>
                </div>
            `;
            }

            // 形态② 真实卡密：归一化为 {display, raw}，display 带商品名便于对照，raw 为可直接粘贴使用的纯卡密
            const rows = [];
            cards.forEach(item => {
                if (typeof item === 'string') rows.push({ display: item, raw: item });
                else if (item && Array.isArray(item.cards)) {
                    item.cards.forEach(c => rows.push({ display: `[${item.productName || item.variantName || ''}] ${c}`, raw: String(c) }));
                }
            });
            if (rows.length === 0) return '<div class="text-muted small">无发货内容</div>';

            const items = rows.map(r => `
                <div class="d-flex align-items-start py-1" style="border-top: 1px dashed rgba(0,0,0,.08);">
                    <div class="flex-grow-1 me-2 user-select-all" style="white-space: pre-wrap; word-break: break-all;">${escapeHtml(r.display)}</div>
                    ${mkBtn(r.raw, '复制', '复制这条卡密', '已复制 1 条卡密', 'btn-copy flex-shrink-0')}
                </div>
            `).join('');

            return `
                <div class="card-content-box">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="small text-muted">共 ${rows.length} 条卡密</span>
                        ${mkBtn(rows.map(r => r.raw).join('\n'), '复制全部', '复制全部卡密', '已复制 ' + rows.length + ' 条卡密', 'btn-copy')}
                    </div>
                    ${items}
                </div>
            `;
        }

        // 兼容保留全局 copyText（后台自定义 custom_js 可能仍在调用），内部转交 XYFK 以获得降级与反馈
        function copyText(btn) {
            const prev = btn.previousElementSibling || (btn.parentElement && btn.parentElement.previousElementSibling);
            const content = prev ? prev.textContent : '';
            if (window.XYFK) window.XYFK.copy(content, btn, '已复制');
            else if (navigator.clipboard) navigator.clipboard.writeText(content);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
